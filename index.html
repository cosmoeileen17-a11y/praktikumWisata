    <!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Menu Navigasi Saja</title>
  <style>
    /* Desain pembungkus menu utama */
    .menu-navigasi {
      display: flex;               /* Membuat menu sejajar secara horizontal */
      background-color: blue;      /* Warna background biru */
      width: 100%;                 /* Lebar menu memenuhi layar */
      height:40 ;            /* Batas maksimal lebar (bisa disesuaikan) */
      margin: 20px auto;           /* Membuat menu berada di tengah halaman */
    }

    /* Desain untuk setiap tombol menu (link) */
    .menu-navigasi a {
      flex: 1;                     /* Membagi lebar ketiga menu sama rata */
      text-align: center;          /* Mengatur posisi teks di tengah */
      color: white;                /* Warna teks putih */
      text-decoration: none;       /* Menghilangkan garis bawah bawaan pada link */
      padding: 15px 0;             /* Ruang kosong di atas dan bawah teks agar kotak membesar */
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      border-right: 1px solid white; /* Garis pemisah antar menu berwarna putih */
      display: block;              /* Memastikan seluruh area kotak bisa diklik */
      transition: 0.3s;            /* Transisi halus untuk efek hover */
    }

    /* Menghilangkan garis putih di sebelah kanan menu paling akhir */
    .menu-navigasi a:last-child {
      border-right: none;
    }

    /* Efek ketika mouse diarahkan ke menu (hover) */
    .menu-navigasi a:hover {
      background-color: darkblue;  /* Warna berubah menjadi biru tua saat disorot */
    }
  </style>
</head>
